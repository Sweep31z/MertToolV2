name: Build MertTool

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Release
      run: dotnet build -c Release
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MertTool-exe
        path: bin/Release/
